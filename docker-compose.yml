services:
  # NOTE: if MySQL/Redis are already running natively on the host (Windows
  # service "MySQL80", standalone Memurai on 6379), stop them first or remap
  # the ports below — both default to the same ports and the container will
  # fail to bind otherwise.
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dawger_2024
      MYSQL_DATABASE: dawger
      MYSQL_USER: dawger
      MYSQL_PASSWORD: dawger_pass
    volumes:
      - mysql_data:/var/lib/mysql
      # Alphabetical order = execution order: full schema first, then the
      # (now redundant but harmless — CREATE TABLE IF NOT EXISTS) wrapped-only
      # script kept for anyone still relying on it standalone.
      - ./API/Mainapi/exportscripts/schema_full_init.sql:/docker-entrypoint-initdb.d/00_schema_full_init.sql
      - ./API/Mainapi/wrapped_tables.sql:/docker-entrypoint-initdb.d/01_wrapped.sql
    ports:
      # 3307 côté hôte : le 3306 natif est déjà pris sur cette machine (MySQL
      # local). Sans incidence sur api/proxiesembed, qui parlent au conteneur
      # "mysql" via le réseau interne Docker sur le port 3306 quoi qu'il arrive.
      - "3307:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_pass
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MAIN_API: http://localhost:25565
        VITE_SITE_URL: http://localhost:3001
        VITE_WATCHPARTY_API: http://localhost:25566
    restart: unless-stopped
    # Le stage final du Dockerfile lance "npm run dev" (pas le build statique),
    # donc les ARG/ENV du builder ne sont pas dispo au runtime, et .env est
    # exclu du build context par .dockerignore -- sans ceci, VITE_TMDB_API_KEY
    # et les autres VITE_* sont vides dans le conteneur (401 sur TMDB, etc).
    env_file:
      - ./.env
    environment:
      VITE_SITE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - api

  api:
    build:
      context: ./API/Mainapi
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "25565:25565"
    env_file:
      - ./API/Mainapi/.env
    environment:
      # Ecrase les valeurs locales du .env pour pointer vers les
      # conteneurs mysql/redis de cette stack au lieu de localhost.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: dawger
      DB_PASSWORD: dawger_pass
      DB_NAME: dawger
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_pass
    depends_on:
      - mysql
      - redis

  # API/watchpartyAPI/ is currently missing from this checkout — this service
  # will fail to build until that folder is restored. Gated behind a profile
  # so plain `docker compose up` (or `up mysql redis api proxiesembed
  # bypass403`) skips it instead of failing the whole stack. Run it
  # explicitly once the folder exists: `docker compose --profile watchparty up`.
  watchparty:
    profiles: ["watchparty"]
    build:
      context: ./API/watchpartyAPI
      dockerfile: Dockerfile.watchparty
    restart: unless-stopped
    ports:
      - "25566:25566"

  proxiesembed:
    build:
      context: ./API/proxiesembed
      dockerfile: Dockerfile.proxiesembed
    restart: unless-stopped
    ports:
      - "25569:25569"
    env_file:
      - ./API/proxiesembed/.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: dawger
      DB_PASSWORD: dawger_pass
      DB_NAME: dawger

  bypass403:
    build:
      context: ./API/miscs
      dockerfile: Dockerfile.bypass
    restart: unless-stopped
    ports:
      - "25568:25568"

volumes:
  mysql_data: